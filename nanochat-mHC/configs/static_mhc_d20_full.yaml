# static mHC depth=20 full training config
# matches the successful wandb run exactly
# requires 8 GPUs (e.g., 8xH100 or 8xA100)

# user settings
run: "mhc-d20-static-full"
seed: -1

# runtime
device_type: ""
skip_compile: false # sinkhorn has @torch.compiler.disable

# model architecture
depth: 20
max_seq_len: 2048

# mHC settings (static mode)
mhc_enabled: true
mhc_static: true
mhc_num_streams: 4
mhc_sinkhorn_iters: 20
mhc_sinkhorn_tau: 0.05
mhc_gate_noise: false

# training
num_iterations: -1 # auto-calculate from target_param_data_ratio
target_flops: -1
target_param_data_ratio: 20

# batch size
device_batch_size: 8
total_batch_size: 524288

# optimizer
embedding_lr: 0.2
unembedding_lr: 0.004
matrix_lr: 0.02
weight_decay: 0.0
grad_clip: 1.0
warmup_ratio: 0.0
warmdown_ratio: 0.2
final_lr_frac: 0.0

# checkpointing
resume_from_step: -1
save_every: -1

# evaluation
eval_every: 500
eval_tokens: 10485760
core_metric_every: 5000
core_metric_max_per_task: 500
sample_every: 2000

# output
model_tag: ""
